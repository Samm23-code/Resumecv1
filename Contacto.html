<head>

</head>
<body>

<header>

  <!-- Botón hamburguesa -->

    <div></div>

  <!-- Menú -->

  </nav>
</header>

<section class="contact" id="contacto">
  <h2 class="contact-title">Hablemos de tu <span>Proyecto</span></h2>
  <p class="contact-subtitle">Cuéntame qué necesitas y te responderé lo antes posible</p>

  <form class="contact-form" action="https://formspree.io/f/moeaywnw" method="POST">
    
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
    </div>

    <div class="form-group">
      <label for="email">Correo</label>
      <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
    </div>

    <div class="form-group">
      <label for="servicio">Servicio de interés</label>
      <select id="servicio" name="servicio" required>
        <option value="" disabled selected>Selecciona un servicio</option>
        <option value="Producción Musical">Producción Musical</option>
        <option value="Edición de Video">Edición de Video</option>
        <option value="Guion y Contenido">Guion y Contenido</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntame sobre tu proyecto..." required></textarea>
    </div>

    <button type="submit" class="contact-btn">Enviar Mensaje</button>

  </form>
</section>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
